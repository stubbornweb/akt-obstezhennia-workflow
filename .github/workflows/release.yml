name: Build skill release

on:
  push:
    branches: [main]
    paths: ["akt-obstezhennia/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the object form covers section 1
        run: python3 tools/check_anketa.py

      - name: Smoke test (fill the example act)
        run: python3 akt-obstezhennia/scripts/fill_act.py --data akt-obstezhennia/example.json --out /tmp/test.docx

      - name: Read version from SKILL.md
        id: v
        run: |
          VERSION=$(grep -oP '^Версія \K[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' akt-obstezhennia/SKILL.md)
          test -n "$VERSION" || { echo "No 'Версія X.Y' line in SKILL.md"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: zip -r akt-obstezhennia.zip akt-obstezhennia -x '*__pycache__*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists. Bump 'Версія' in SKILL.md to publish a new one."
            exit 0
          fi
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" akt-obstezhennia.zip $PRERELEASE \
            --title "Скіл akt-obstezhennia $TAG" \
            --notes "Як оновити скіл: https://github.com/stubbornweb/akt-obstezhennia-workflow/blob/main/docs/guide-uk.md#2-оновити-скіл"
